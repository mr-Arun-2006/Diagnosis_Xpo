name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app ../../packages/quant_engine
      - name: Quant smoke test
        run: |
          PYTHONPATH=../../ python - <<'PY'
          import numpy as np
          import pandas as pd
          from packages.quant_engine import diagnose

          n = 120
          close = pd.Series(np.linspace(100, 145, n))
          frame = pd.DataFrame({
              "open": close - 0.5,
              "high": close + 1.0,
              "low": close - 1.0,
              "close": close,
              "volume": pd.Series(np.full(n, 100000.0)),
          })
          result = diagnose(frame)
          assert result["indicator_count"] >= 50
          assert result["regime"] in {"bullish", "bearish", "sideways"}
          print(result)
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
