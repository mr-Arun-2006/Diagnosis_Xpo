name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API / Quant validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app ../../packages/quant_engine

      - name: Import API and quant package
        env:
          PYTHONPATH: ../../
        run: python -c "from app.main import app; from packages.quant_engine import diagnose; print(app.title); print(diagnose.__name__)"

      - name: Quant smoke test
        env:
          PYTHONPATH: ../../
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from packages.quant_engine import diagnose

          n = 240
          close = pd.Series(np.linspace(100, 145, n), dtype=float)
          frame = pd.DataFrame({
              "open": close - 0.5,
              "high": close + 1.0,
              "low": close - 1.0,
              "close": close,
              "volume": pd.Series(np.full(n, 100000.0), dtype=float),
          })
          result = diagnose(frame)
          assert result["indicator_count"] >= 60
          assert result["regime"] in {"bullish", "bearish", "sideways"}
          assert 0 <= result["score"] <= 100
          print(result)
          PY

  web:
    name: Web production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
