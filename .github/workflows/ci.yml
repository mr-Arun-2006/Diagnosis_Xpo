name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile API and quant engine
        run: python -m compileall app ../../packages/quant_engine

      - name: Quant engine smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from packages.quant_engine import diagnose

          n = 120
          close = pd.Series(np.linspace(100.0, 145.0, n))
          frame = pd.DataFrame({
              "open": close - 0.5,
              "high": close + 1.0,
              "low": close - 1.0,
              "close": close,
              "volume": 100000.0,
          })

          result = diagnose(frame)
          assert result["indicator_count"] >= 50
          assert result["regime"] in {"bullish", "bearish", "sideways"}
          print(f"Quant smoke test passed: {result['indicator_count']} indicators, regime={result['regime']}")
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Build web application
        run: npm run build
