services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diagnosis
      POSTGRES_USER: diagnosis
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnosis -d diagnosis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://diagnosis:change-me@db:5432/diagnosis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-in-development
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
